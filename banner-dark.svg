<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: deep dark navy to dark purple -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#0d0d2b"/>
      <stop offset="100%" stop-color="#110a2e"/>
    </linearGradient>

    <!-- Accent glow: purple to cyan -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Name text gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Glow filter for the accent bar -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for circles -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>

    <!-- Subtle text shadow -->
    <filter id="textShadow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c3aed" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- Subtle grid lines horizontal -->
  <line x1="0" y1="70" x2="1200" y2="70" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="140" x2="1200" y2="140" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Subtle grid lines vertical -->
  <line x1="200" y1="0" x2="200" y2="280" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="280" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="280" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="280" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="1000" y1="0" x2="1000" y2="280" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>

  <!-- Background ambient glow blobs -->
  <ellipse cx="150" cy="140" rx="200" ry="140" fill="#7c3aed" opacity="0.06" filter="url(#softGlow)"/>
  <ellipse cx="1050" cy="140" rx="200" ry="140" fill="#06b6d4" opacity="0.06" filter="url(#softGlow)"/>
  <ellipse cx="600" cy="60" rx="300" ry="80" fill="#6366f1" opacity="0.04" filter="url(#softGlow)"/>

  <!-- Decorative circuit-style lines — left side -->
  <polyline points="20,80 60,80 80,60 120,60" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1" fill="none"/>
  <polyline points="20,180 50,180 70,200 110,200" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="1" fill="none"/>
  <circle cx="120" cy="60" r="2.5" fill="#7c3aed" opacity="0.5"/>
  <circle cx="110" cy="200" r="2.5" fill="#06b6d4" opacity="0.5"/>
  <polyline points="20,130 40,130 60,110 90,110 110,130 140,130" stroke="#6366f1" stroke-opacity="0.2" stroke-width="1" fill="none"/>

  <!-- Decorative circuit-style lines — right side -->
  <polyline points="1180,80 1140,80 1120,60 1080,60" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1" fill="none"/>
  <polyline points="1180,180 1150,180 1130,200 1090,200" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="1" fill="none"/>
  <circle cx="1080" cy="60" r="2.5" fill="#7c3aed" opacity="0.5"/>
  <circle cx="1090" cy="200" r="2.5" fill="#06b6d4" opacity="0.5"/>
  <polyline points="1180,130 1160,130 1140,110 1110,110 1090,130 1060,130" stroke="#6366f1" stroke-opacity="0.2" stroke-width="1" fill="none"/>

  <!-- Small decorative dots top-right cluster -->
  <circle cx="980" cy="30" r="1.5" fill="#c084fc" opacity="0.4"/>
  <circle cx="993" cy="22" r="1.5" fill="#22d3ee" opacity="0.4"/>
  <circle cx="1006" cy="30" r="1.5" fill="#c084fc" opacity="0.4"/>
  <circle cx="993" cy="38" r="1.5" fill="#22d3ee" opacity="0.3"/>

  <!-- Small decorative dots bottom-left cluster -->
  <circle cx="210" cy="250" r="1.5" fill="#c084fc" opacity="0.4"/>
  <circle cx="223" cy="242" r="1.5" fill="#22d3ee" opacity="0.4"/>
  <circle cx="236" cy="250" r="1.5" fill="#c084fc" opacity="0.4"/>

  <!-- Code bracket decoration left — { } -->
  <text x="168" y="155" font-family="'Courier New', monospace" font-size="72" fill="#7c3aed" opacity="0.08" font-weight="bold">{</text>
  <!-- Code bracket decoration right -->
  <text x="980" y="155" font-family="'Courier New', monospace" font-size="72" fill="#06b6d4" opacity="0.08" font-weight="bold">}</text>

  <!-- Closing tag decoration bottom-right -->
  <text x="900" y="258" font-family="'Courier New', monospace" font-size="13" fill="#6366f1" opacity="0.25">&lt;/dev&gt;</text>
  <!-- Opening tag decoration top-left -->
  <text x="58" y="32" font-family="'Courier New', monospace" font-size="13" fill="#6366f1" opacity="0.25">&lt;dev&gt;</text>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="277" width="1200" height="3" fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Central vertical accent line (subtle) -->
  <rect x="598" y="30" width="2" height="40" fill="url(#accentGrad)" opacity="0.15" rx="1"/>

  <!-- MAIN NAME -->
  <text
    x="600" y="128"
    text-anchor="middle"
    font-family="'Segoe UI', 'Arial', sans-serif"
    font-size="52"
    font-weight="700"
    fill="url(#nameGrad)"
    filter="url(#textShadow)"
    letter-spacing="3"
  >ANUSHKA PATIL</text>

  <!-- Thin underline accent below name -->
  <rect x="390" y="140" width="420" height="1.5" fill="url(#accentGrad)" opacity="0.5" rx="1"/>

  <!-- Subtitle: role tagline -->
  <text
    x="600" y="178"
    text-anchor="middle"
    font-family="'Segoe UI', 'Arial', sans-serif"
    font-size="17"
    font-weight="400"
    fill="#a5b4fc"
    letter-spacing="4"
  >Developer  ·  AI/ML Learner  ·  Hackathon Builder</text>

  <!-- Bottom tagline -->
  <text
    x="600" y="220"
    text-anchor="middle"
    font-family="'Segoe UI', 'Arial', sans-serif"
    font-size="13"
    font-weight="300"
    fill="#64748b"
    letter-spacing="5"
  >AI  ·  WEB DEVELOPMENT  ·  LEARNING &amp; BUILDING</text>

</svg>
